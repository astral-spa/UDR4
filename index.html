<style>/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;
	outline-offset: 1px;
	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {
	border: 2px dotted #38f;
	background: rgba(255,255,255,0.5);
	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;
	background-repeat: no-repeat;
	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;
	border-top-right-radius: 4px;
	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;
	border-top-right-radius: 2px;

.leaflet-touch .leaflet-bar a:last-child {
	border-bottom-left-radius: 2px;
	border-bottom-right-radius: 2px;

.tt-wrap { overflow: auto; max-height: 70vh; border: 1px solid var(--rule); border-radius: 4px; }
table.tt { border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; font-size: .85rem; }
table.tt th, table.tt td { padding: 3px 7px; border-bottom: 1px solid var(--rule); white-space: nowrap; text-align: center; }
table.tt thead th { position: sticky; top: 0; background: var(--surface); z-index: 2; font: 600 .78rem var(--f-body); color: var(--muted); cursor: pointer; border-bottom: 2px solid var(--ink); }
table.tt thead th:hover { color: var(--accent); }
table.tt th.stop { position: sticky; left: 0; background: var(--surface); z-index: 1; text-align: left; font-weight: 400; min-width: 200px; max-width: 280px; white-space: normal; border-right: 1px solid var(--rule); cursor: pointer; line-height: 1.2; }
table.tt thead th.stop { z-index: 3; cursor: default; color: var(--ink); }
table.tt th.stop small { display: block; color: var(--muted); font-size: .72rem; }
table.tt tr.main th.stop { font-weight: 700; }
table.tt tr.main td { font-weight: 700; }
table.tt tr.minor td { color: var(--muted); }
table.tt td.na { color: var(--rule); }
table.tt tr:hover td, table.tt tr:hover th.stop { background: var(--hl-col); }
table.tt .sel { background: var(--hl) !important; }
.rt { display: inline-block; margin-top: 2px; padding: 0 4px; border-radius: 3px; font: 700 .72rem var(--f-body); color: #fff; background: #1f7a3a; white-space: nowrap; }
.rt.late { background: #b3261e; }
.rt.early { background: #8a5a00; }
.pop .rt { margin: 0 2px 0 1px; vertical-align: 1px; }
table.tt td.next { background: #dff3e4 !important; box-shadow: inset 0 0 0 2px #1f7a3a; color: #12502a; font-weight: 700; }
:root[data-theme="dark"] table.tt td.next { background: #173a24 !important; color: #bfe8cb; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) table.tt td.next { background: #173a24 !important; color: #bfe8cb; } }
.bus-ico.live span { box-shadow: 0 0 0 3px #1f7a3a, 0 1px 4px rgba(0,0,0,.45); }
table.tt tbody tr:last-child td, table.tt tbody tr:last-child th { border-bottom: 0; }

.summary { width: 100%; border-collapse: collapse; font-size: .88rem; font-variant-numeric: tabular-nums; }
.summary th, .summary td { padding: 6px 8px; border-bottom: 1px solid var(--rule); text-align: right; }
.summary th:nth-child(-n+2), .summary td:nth-child(-n+2) { text-align: left; }
.summary thead th { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.summary tbody tr { cursor: pointer; }
.summary tbody tr:hover { background: var(--hl-col); }
.summary td.z { color: var(--muted); }
.tbl-scroll { overflow-x: auto; }

footer { grid-column: 1 / -1; font-size: .8rem; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 10px; }
footer a { color: var(--accent); }

.mapbox { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.mapbox:fullscreen, .mapbox.fs { position: fixed; inset: 0; z-index: 1000; background: var(--bg); padding: 10px; }
.mapbox:fullscreen #map, .mapbox.fs #map { flex: 1; height: auto; }
.maptools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: .88rem; }
.maptools .grp { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--rule); background: var(--surface); border-radius: var(--radius); padding: 5px 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; color: inherit; border-color: var(--rule); }
.favbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 8px; padding: 6px 10px; background: var(--hl); border-radius: var(--radius); font-size: .88rem; }
.btn.fav-btn[aria-pressed="true"] { background: #fff4d6; color: #8a5a00; border-color: #c88a00; font-weight: 700; }
.fav-mark { color: #c88a00; margin-right: 1px; }
.lines .fav .meta .rt { margin-left: 4px; }
details.zone { position: relative; }
details.zone > summary { list-style: none; }
details.zone > summary::-webkit-details-marker { display: none; }
details.zone .dd { position: absolute; z-index: 1001; top: calc(100% + 4px); left: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); box-shadow: 0 4px 14px rgba(0,0,0,.18); padding: 8px 10px; min-width: 240px; display: grid; gap: 4px; }
details.zone .dd .row { display: flex; gap: 8px; justify-content: space-between; margin-bottom: 4px; }
details.zone .dd a { color: var(--accent); cursor: pointer; font-size: .8rem; }
details.zone .dd label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
details.zone .dd small { color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
.vehbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; width: 100%; }
.vehbar input[type=range] { flex: 1 1 180px; min-width: 140px; accent-color: var(--accent); }
.vehbar output { font: 700 1.2rem/1 var(--f-display); font-variant-numeric: tabular-nums; min-width: 3.2em; }
.vehbar .cnt { color: var(--muted); font-size: .82rem; }
#mstatus { color: var(--muted); font-size: .82rem; }
.bus-ico span { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; border-radius: 4px; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.45); font: 700 .78rem/1 var(--f-display); white-space: nowrap; }
.me-ico { width: 16px; height: 16px; border-radius: 50%; background: #1a73e8; border: 3px solid #fff; box-shadow: 0 0 0 2px rgba(26,115,232,.35), 0 1px 4px rgba(0,0,0,.4); }
.near { display: grid; gap: 4px; margin-top: 6px; }
.near button { all: unset; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-bottom: 1px solid var(--rule); }
.near button:hover { color: var(--accent); }
.near small { color: var(--muted); font-variant-numeric: tabular-nums; }
@media print {
  aside.index, .maptools, .controls, footer, .leaflet-control-container .leaflet-control-zoom, .leaflet-control-layers, .tile-warn { display: none !important; }
  .app { display: block; padding: 0; }
  #map { height: 560px; break-inside: avoid; }
  .tt-wrap { max-height: none; overflow: visible; }
  body { background: #fff; }
}

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .lines { max-height: 260px; }
  #map { height: 360px; }
  header.top h1 { font-size: 1.7rem; }
  header.top { grid-template-columns: minmax(0, 1fr); }
  header.top .logo { grid-row: 1; }
  header.top .logo img { height: 48px; }
  header.top .controls { justify-self: start; align-items: flex-start; }
  header.top .controls .riga { justify-content: flex-start; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

    <div class="controls">
      <span class="ia">generato con IA</span>
      <div class="riga">
        <label for="giorno">Giorno <input type="date" id="giorno"></label>
        <span class="daytag" id="daytag"></span>
      </div>
    </div>
  </header>

  <aside class="index">
    <input class="search" id="cerca" type="search" placeholder="Cerca linea o fermata…" aria-label="Cerca linea o fermata">
    <ul class="lines" id="elenco"></ul>
  </aside>

  <main>
    <div class="mapbox" id="mapbox">
      <div id="map" role="region" aria-label="Mappa della rete"></div>
      <div class="maptools">
        <div class="grp">
          <details class="zone" id="zone"><summary class="btn">Zone <span id="zoneCnt"></span> ▾</summary><div class="dd" id="zoneList"></div></details>
          <label class="chk"><input type="checkbox" id="soloAttive"> Solo linee in servizio nel giorno</label>
        </div>
        <div class="grp">
          <button class="btn" id="vicino" type="button" title="Mostra la tua posizione e le fermate più vicine">◎ Vicino a me</button>
          <button class="btn" id="schermo" type="button" aria-pressed="false" title="Mappa a schermo intero">⛶ Schermo intero</button>
          <button class="btn" id="stampa" type="button" title="Stampa mappa e orario">⎙ Stampa</button>
          <span id="mstatus" role="status"></span>
        </div>
        <div class="vehbar">
          <button class="btn" id="vehOn" type="button" aria-pressed="false" title="Posizione dei bus ricavata dagli orari programmati (non in tempo reale)">🚌 Bus in viaggio</button>
          <button class="btn" id="vehPlay" type="button" disabled title="Avvia / ferma lo scorrere del tempo">▶</button>
          <input type="range" id="vehMin" step="1" disabled aria-label="Ora della simulazione">
          <output id="vehOut">--:--</output>
          <button class="btn" id="vehNow" type="button" disabled>Adesso</button>
          <span class="cnt" id="vehCnt"></span>
        </div>
      </div>
    </div>
    <section class="panel" id="pannello"></section>
  </main>

  <footer id="piede"></footer>
</div>

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hhmm = m => String(Math.floor(m / 60) % 24).padStart(2, "0") + ":" + String(Math.floor(m) % 60).padStart(2, "0");
const ymd = d => d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
const fromYmd = s => new Date(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8));
const isoOf = s => s.slice(0, 4) + "-" + s.slice(4, 6) + "-" + s.slice(6, 8);
const itDate = s => fromYmd(s).toLocaleDateString("it-IT", { day: "numeric", month: "short", year: "numeric" });
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const itLong = s => fromYmd(s).toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" });
function textOn(hex) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) > 170 ? "#111" : "#fff";
}
const badge = (l, cls = "") => `<span class="badge ${cls}" style="background:${l.col};color:${textOn(l.col)}">${esc(l.n)}</span>`;
function decode(str) {
  const pts = []; let i = 0, lat = 0, lon = 0;
  while (i < str.length) {
    for (const k of [0, 1]) {
      let shift = 0, res = 0, b;
      do { b = str.charCodeAt(i++) - 63; res |= (b & 31) << shift; shift += 5; } while (b >= 32);
      const v = res & 1 ? ~(res >> 1) : res >> 1;
      if (k === 0) lat += v; else lon += v;
    }
    pts.push([lat / 1e5, lon / 1e5]);
  }
  return pts;
}
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

/* ---------- indici ---------- */
const SVC = D.servizi;
const svcDates = Object.fromEntries(Object.entries(SVC).map(([k, v]) => [k, new Set(v.date)]));
const LINEE = D.linee;
const byId = Object.fromEntries(LINEE.map(l => [l.id, l]));
const STOPS = D.fermate;
const shapeCache = {};
const shapePts = id => shapeCache[id] || (shapeCache[id] = decode(D.shapes[id] || ""));

// fermata -> [{linea, tab, col (indice riga), }]
const stopUse = STOPS.map(() => []);
LINEE.forEach(l => l.tab.forEach(t => t.fermate.forEach((s, i) => stopUse[s].push({ l, t, i }))));

const state = { day: null, line: null, svc: null, dir: null, onlyMain: true, trip: null, variant: null };

/* ---------- percorsi (varianti) di una linea ---------- */
// ogni shape del GTFS è un percorso: direzione, capolinea, numero di corse; lettere A, B, … per direzione (A = più corse)
const percCache = {};
function percorsiOf(l) {
  if (percCache[l.id]) return percCache[l.id];
  const m = new Map();
  l.tab.forEach(t => t.corse.forEach(c => {
    let v = m.get(c.shape);
    if (!v) {
      const sv = []; c.o.forEach((x, k) => { if (x != null) sv.push(k); });
      v = { id: c.shape, dir: t.dir, titolo: t.titolo, da: t.fermate[sv[0]], a: t.fermate[sv[sv.length - 1]], n: 0, tabs: [],
        serv: new Set(sv.map(k => STOPS[t.fermate[k]][1])) };
      m.set(c.shape, v);
    }
    v.n++; if (!v.tabs.includes(t)) v.tabs.push(t);
  }));
  const dirs = [...new Set(l.tab.map(t => t.dir))].sort();
  const out = [];
  dirs.forEach(d => {
    const vs = [...m.values()].filter(v => v.dir === d).sort((a, b) => b.n - a.n);
    vs.forEach((v, i) => { v.lett = String.fromCharCode(65 + i); v.princ = i === 0; v.km = D.shape_km[v.id]; v.multi = vs.length > 1; });
    // in cosa la variante differisce dal percorso principale (A): fermate in più o saltate
    vs.slice(1).forEach(v => {
      const elenco = a => a.length > 3 ? a.slice(0, 3).join(", ") + ` e altre ${a.length - 3}` : a.join(", ");
      const cap = new Set([v.da, v.a, vs[0].da, vs[0].a].map(i => STOPS[i][1])); // i capolinea sono già scritti
      const piu = [...v.serv].filter(x => !vs[0].serv.has(x) && !cap.has(x)), meno = [...vs[0].serv].filter(x => !v.serv.has(x) && !cap.has(x));
      v.diff = [piu.length ? "passa anche da " + elenco(piu) : "", meno.length ? "non passa da " + elenco(meno) : ""].filter(Boolean).join("; ");
    });
    out.push(...vs);
  });
  return (percCache[l.id] = out);
}
const vlett = (v, col) => `<span class="vl" style="border-color:${col}">${v.lett}</span>`;
function corseNelGiorno(l, v) {
  let n = 0; l.tab.forEach(t => { if (activeOn(t.svc, state.day)) t.corse.forEach(c => { if (c.shape === v.id) n++; }); });
  return n;
}

function activeOn(svc, day) { return svcDates[svc] && svcDates[svc].has(day); }
function tripsOn(l, day) {
  return l.tab.filter(t => activeOn(t.svc, day)).reduce((n, t) => n + t.corse.length, 0);
}

/* ---------- mappa ---------- */
const map = L.map("map", { preferCanvas: true, zoomControl: true, zoomSnap: 0.25 }).setView([41.95, 12.8], 11);
// sfondi Esri: funzionano sia online sia aprendo il file in locale (doppio clic)
const LOCALE = location.protocol === "file:";
const ESRI_ATTR = 'Mappa &copy; <a href="https://www.esri.com/" target="_blank" rel="noopener">Esri</a> e fornitori';
const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/";
const BASI = {
  "Esri stradale": L.tileLayer(ESRI + "World_Street_Map/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: ESRI_ATTR }),
  "Esri topografica": L.tileLayer(ESRI + "World_Topo_Map/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: ESRI_ATTR }),
  "Esri grigio chiaro": L.tileLayer(ESRI + "Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, maxNativeZoom: 16, attribution: ESRI_ATTR }),
  "Esri satellite": L.tileLayer(ESRI + "World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: ESRI_ATTR + ', Maxar, Earthstar Geographics' })
};
const BASE_KEY = "udr4-sfondo-" + (LOCALE ? "file" : "web");
const avvisoTile = L.control({ position: "bottomleft" });
avvisoTile.onAdd = () => {
  const d = L.DomUtil.create("div", "tile-warn");
  d.hidden = true;
  d.textContent = "Sfondo Esri non caricato: questa anteprima non può scaricare le mappe. Apri la pagina in un browser con connessione a internet.";
  return d;
};
avvisoTile.addTo(map);
let tileOk = 0, tileErr = 0;
Object.entries(BASI).forEach(([nome, layer]) => {
  layer.on("tileload", () => { tileOk++; avvisoTile.getContainer().hidden = true; });
  layer.on("tileerror", () => { tileErr++; if (!tileOk && tileErr >= 4) avvisoTile.getContainer().hidden = false; });
  layer.on("add", () => { tileOk = 0; tileErr = 0; store.set(BASE_KEY, nome); });
});
(BASI[store.get(BASE_KEY)] || BASI["Esri stradale"]).addTo(map);
L.control.layers(BASI, null, { position: "topright" }).addTo(map);
const renderer = L.canvas({ padding: 0.3 });
const lineLayers = {};
const allBounds = L.latLngBounds([]);
LINEE.forEach(l => {
  const g = L.featureGroup();
  l.shapes.forEach(s => {
    const pts = shapePts(s);
    if (!pts.length) return;
    const casing = L.polyline(pts, { renderer, color: "#000", opacity: 0, weight: 9 });
    const pl = L.polyline(pts, { renderer, color: l.col, weight: 3.5, opacity: .85 });
    casing.on("click", () => go(l.id)); pl.on("click", () => go(l.id));
    pl.bindTooltip(`Linea ${l.n} · ${l.nome}`, { sticky: true });
    g.addLayer(casing); g.addLayer(pl);
  });
  g.addTo(map);
  lineLayers[l.id] = g;
  if (g.getLayers().length) allBounds.extend(g.getBounds());
});
// senza animazione: uno zoom animato qui finirebbe dopo l'apertura di una linea dal link e ne annullerebbe la centratura
if (allBounds.isValid()) map.fitBounds(allBounds, { padding: [20, 20], animate: false });

const stopLayer = L.layerGroup().addTo(map);
const tripLayer = L.layerGroup().addTo(map);
const stopMarkers = {};

function stopsOverview() {
  stopLayer.clearLayers();
  Object.keys(stopMarkers).forEach(k => delete stopMarkers[k]);
  STOPS.forEach((s, i) => {
    if (!stopUse[i].some(u => lineVisible(u.l))) return;
    const m = L.circleMarker([s[3], s[4]], { renderer, radius: 3, weight: 1, color: "#fff", fillColor: "#33413c", fillOpacity: .9 });
    m.on("click", () => openStop(i));
    stopMarkers[i] = m;
    stopLayer.addLayer(m);
  });
}
function stopsForLine(l) {
  stopLayer.clearLayers();
  Object.keys(stopMarkers).forEach(k => delete stopMarkers[k]);
  const seen = new Set();
  l.tab.forEach(t => t.fermate.forEach((s, i) => {
    if (seen.has(s)) return; seen.add(s);
    const p = STOPS[s];
    const main = t.princ[i];
    const m = L.circleMarker([p[3], p[4]], { renderer, radius: main ? 6 : 4, weight: 2, color: l.col, fillColor: "#fff", fillOpacity: 1 });
    m.bindTooltip(p[1], { direction: "top", offset: [0, -4] });
    m.on("click", () => openStop(s));
    stopMarkers[s] = m;
    stopLayer.addLayer(m);
  }));
}
function updateZoomStops() {
  if (state.line) return;
  const show = map.getZoom() >= 13;
  if (show && !map.hasLayer(stopLayer)) map.addLayer(stopLayer);
  if (!show && map.hasLayer(stopLayer)) map.removeLayer(stopLayer);
}
map.on("zoomend", updateZoomStops);

function departuresAt(stopIdx, day) {
  // raggruppa per linea + direzione
  const groups = new Map();
  stopUse[stopIdx].forEach(({ l, t, i }) => {
    if (!activeOn(t.svc, day)) return;
    const last = t.fermate.length - 1;
    t.corse.forEach(c => {
      const v = c.o[i];
      if (v == null) return;
      // escludi l'ultima fermata effettiva della corsa (solo arrivo)
      let lastServed = -1; for (let k = c.o.length - 1; k >= 0; k--) if (c.o[k] != null) { lastServed = k; break; }
      if (lastServed === i) return;
      const key = l.id + "|" + t.titolo;
      if (!groups.has(key)) groups.set(key, { l, titolo: t.titolo, times: [] });
      groups.get(key).times.push({ m: v, id: rtKey(c) });
    });
  });
  return [...groups.values()].map(g => (g.times.sort((a, b) => a.m - b.m), g))
    .sort((a, b) => LINEE.indexOf(a.l) - LINEE.indexOf(b.l));
}
// bus in viaggio (tempo reale) che devono ancora passare dalla fermata, compresi gli arrivi al capolinea,
// che fra le partenze non compaiono
function arriviLive(stopIdx) {
  if (!rtLive()) return [];
  const now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes();
  const out = [];
  stopUse[stopIdx].forEach(({ l, t, i }) => {
    t.corse.forEach(c => {
      if (c.o[i] == null) return;
      const r = rtOf(rtKey(c)), nr = rtNextRow(c);
      if (nr == null || nr > i) return;  // non in viaggio, o fermata già passata
      let ultima = -1; for (let k = c.o.length - 1; k >= 0; k--) if (c.o[k] != null) { ultima = k; break; }
      const prev = Math.round(c.o[i] + (r.ritardo || 0) / 60);
      if (prev < nowMin - 10) return;  // arrivo previsto da più di 10 minuti: dato non aggiornato, non si mostra
      out.push({ l, titolo: t.titolo, r, m: c.o[i], prev, capolinea: ultima === i });
    });
  });
  return out.sort((a, b) => a.prev - b.prev);
}
function openStop(i) {
  const s = STOPS[i];
  const deps = departuresAt(i, state.day);
  const now = new Date(); const isToday = ymd(now) === state.day;
  const nowMin = now.getHours() * 60 + now.getMinutes();
  let html = `<div class="pop"><h4>${esc(s[1])}</h4><div class="loc">${esc(s[2] || "")}${s[2] ? " · " : ""}partenze ${esc(itLong(state.day))}</div>`;
  const arr = arriviLive(i);
  if (arr.length) {
    html += `<div class="arr"><div class="arr-h">In arrivo · tempo reale</div><div class="dep">` + arr.map(a =>
      `<div>${badge(a.l, "sm")}</div><div><div style="font-size:.78rem;color:var(--muted)">→ ${esc(a.titolo)}${a.capolinea ? " · <b>arrivo al capolinea</b>" : ""}</div>` +
      `<div class="times">previsto <b>${hhmm(a.prev)}</b> (orario ${hhmm(a.m)})${rtBadge(a.r)}</div></div>`).join("") + `</div></div>`;
  }
  if (!deps.length) html += `<div class="none">Nessuna partenza in questo giorno.</div>`;
  else {
    html += `<div class="dep">`;
    deps.forEach(g => {
      html += `<div>${badge(g.l, "sm")}</div><div><div style="font-size:.78rem;color:var(--muted)">→ ${esc(g.titolo)}</div><div class="times">` +
        g.times.map(({ m, id }) => {
          const r = rtOf(id), late = r && r.stato === "IN_SERVICE" ? rtMin(r) : 0;
          return isToday && m + late < nowMin ? `<span class="past">${hhmm(m)}</span>` : `<b>${hhmm(m)}</b>${rtBadge(r)}`;
        }).join(" ") + `</div></div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;
  L.popup({ maxWidth: 340 }).setLatLng([s[3], s[4]]).setContent(html).openOn(map);
}

/* ---------- elenco linee ---------- */
// comuni della linea: di solito uno (area); con più comuni la linea compare sotto ciascuno
const areeDi = l => l.aree || [l.area];
function renderList() {
  const q = $("#cerca").value.trim().toLowerCase();
  let stopHits = [];
  if (q.length >= 3) {
    stopHits = STOPS.map((s, i) => [s, i]).filter(([s, i]) => stopUse[i].length && (s[1] + " " + s[2]).toLowerCase().includes(q)).slice(0, 12);
  }
  const areas = new Map();
  LINEE.forEach(l => {
    const hay = (l.n + " " + l.nome + " " + l.area + " " + (l.comuni || []).join(" ")).toLowerCase();
    const viaStop = stopHits.some(([s, i]) => stopUse[i].some(u => u.l === l));
    if (q && !hay.includes(q) && !viaStop) return;
    areeDi(l).forEach(a => {
      if (!areas.has(a)) areas.set(a, []);
      areas.get(a).push(l);
    });
  });
  // comuni in ordine alfabetico ("Altre linee", senza comune, in fondo)
  const ordinate = [...areas].sort(([a], [b]) => (!a) - (!b) || a.localeCompare(b, "it"));
  areas.clear(); ordinate.forEach(([a, ls]) => areas.set(a, ls));
  let html = "";
  // corse preferite (solo senza ricerca): in ordine di partenza
  const fav = q ? [] : preferiti.map(trovaPreferito).filter(Boolean).sort((a, b) => partenza(a.c) - partenza(b.c));
  if (fav.length) {
    html += `<li><h3>★ Le mie corse</h3></li>`;
    fav.forEach(({ l, t, c }) => {
      const on = activeOn(t.svc, state.day);
      html += `<li class="fav"><button data-favline="${esc(l.id)}" data-favtrip="${esc(c.id)}"><span class="${on ? "" : "off"}">${badge(l)}</span>` +
        `<span class="nm">${hhmm(partenza(c))} da ${esc(primaFermata(t, c))} → ${esc(t.titolo)}<span class="meta">` +
        `${on ? esc(SVC[t.svc].label) : "non circola in questo giorno"}<span data-favrt>${favRT(c)}</span></span></span></button></li>`;
    });
  }
  if (stopHits.length) {
    html += `<li><h3>Fermate</h3></li>`;
    stopHits.forEach(([s, i]) => {
      const ls = [...new Set(stopUse[i].map(u => u.l))];
      html += `<li><button data-stop="${i}"><span style="display:flex;gap:3px;flex-wrap:wrap">${ls.slice(0, 2).map(l => badge(l, "sm")).join("")}</span><span class="nm">${esc(s[1])}<span class="meta">${esc(s[2])}</span></span></button></li>`;
    });
  }
  for (const [area, ls] of areas) {
    html += `<li><h3>${esc(area || "Altre linee")}</h3></li>`;
    ls.forEach(l => {
      const n = tripsOn(l, state.day);
      html += `<li><button data-line="${esc(l.id)}" aria-current="${state.line === l.id}"><span class="${n ? "" : "off"}">${badge(l)}</span>` +
        `<span class="nm">${esc(l.nome)}<span class="meta">${n ? n + " corse in questo giorno" : "non attiva in questo giorno"}</span></span></button></li>`;
    });
  }
  if (!html) html = `<li><h3>Nessun risultato</h3></li>`;
  $("#elenco").innerHTML = html;
}
$("#elenco").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.favline) {
    const r = trovaPreferito({ line: b.dataset.favline, id: b.dataset.favtrip });
    if (r) apriCorsa(r.l, r.t, r.c);
  } else if (b.dataset.line) go(b.dataset.line);
  else if (b.dataset.stop) {
    const i = +b.dataset.stop, s = STOPS[i];
    map.setView([s[3], s[4]], 16);
    openStop(i);
  }
});
$("#cerca").addEventListener("input", renderList);

/* ---------- pannello ---------- */
function renderOverview() {
  const svcs = Object.keys(SVC).filter(k => LINEE.some(l => l.tab.some(t => t.svc === k)));
  let rows = LINEE.map(l => {
    const per = svcs.map(s => l.tab.filter(t => t.svc === s).reduce((n, t) => n + t.corse.length, 0));
    const today = tripsOn(l, state.day);
    return `<tr data-line="${esc(l.id)}"><td>${badge(l, "sm")}</td><td>${esc(l.nome)}</td>` +
      per.map(n => `<td class="${n ? "" : "z"}">${n || "–"}</td>`).join("") +
      `<td class="${today ? "" : "z"}"><b>${today || "–"}</b></td><td>${l.km != null ? l.km.toLocaleString("it-IT") : ""}</td></tr>`;
  }).join("");
  const totToday = LINEE.reduce((n, l) => n + tripsOn(l, state.day), 0);
  $("#pannello").innerHTML = `
    <h2>Quadro delle linee</h2>
    <p class="note">Seleziona una linea dall'elenco, dalla mappa o dalla tabella per vederne percorso e orari. Tocca una fermata sulla mappa per le partenze del giorno scelto. ${esc(cap(itLong(state.day)))} circolano <b>${totToday}</b> corse.</p>
    <div class="tbl-scroll"><table class="summary"><thead><tr><th>Linea</th><th>Percorso</th>
    ${svcs.map(s => `<th>${esc(SVC[s].label)}</th>`).join("")}
    <th>Corse nel giorno</th><th>Km max</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  $("#pannello tbody").addEventListener("click", e => { const tr = e.target.closest("tr"); if (tr) go(tr.dataset.line); });
}

function pickDefaults(l) {
  const svcs = [...new Set(l.tab.map(t => t.svc))];
  if (!state.svc || !svcs.includes(state.svc) || !activeOn(state.svc, state.day)) {
    state.svc = svcs.find(s => activeOn(s, state.day)) || svcs[0];
  }
  const dirs = l.tab.filter(t => t.svc === state.svc).map(t => t.dir);
  if (!dirs.includes(state.dir)) state.dir = dirs[0];
}

/* ---------- corse preferite: salvate nel browser di chi usa il sito (nessun account) ---------- */
const PREF_KEY = "udr4-preferiti";
let preferiti = (() => { try { return JSON.parse(store.get(PREF_KEY) || "[]"); } catch (e) { return []; } })();
const partenza = c => c.o.find(v => v != null);
const primaFermata = (t, c) => STOPS[t.fermate[c.o.findIndex(v => v != null)]][1];
// una corsa preferita si ritrova per id; con un GTFS nuovo che rinumera le corse, per linea, direzione e partenza
function trovaPreferito(f) {
  const l = byId[f.line]; if (!l) return null;
  const cerca = (ok, prova) => { for (const t of l.tab) if (ok(t)) { const c = t.corse.find(prova); if (c) return { l, t, c }; } return null; };
  return cerca(() => true, c => c.id === f.id) ||
    (f.dep != null && (cerca(t => t.svc === f.svc && t.dir === f.dir, c => partenza(c) === f.dep) ||
                       cerca(t => t.dir === f.dir, c => partenza(c) === f.dep))) || null;
}
const isPreferito = (l, c) => preferiti.some(f => f.line === l.id && f.id === c.id);
function togglePreferito(l, t, c) {
  if (isPreferito(l, c)) preferiti = preferiti.filter(f => !(f.line === l.id && f.id === c.id));
  else preferiti.push({ line: l.id, svc: t.svc, dir: t.dir, id: c.id, dep: partenza(c) });
  store.set(PREF_KEY, JSON.stringify(preferiti));
}
function apriCorsa(l, t, c) {
  go(l.id);
  state.svc = t.svc; state.dir = t.dir; state.trip = c.id;
  renderLine(); drawTrip(c);
}
// tempo reale della corsa preferita: ritardo e prossima fermata, se è in viaggio
function favRT(c) {
  if (typeof rtOf !== "function") return "";
  const r = rtOf(rtKey(c));
  if (!r || r.stato !== "IN_SERVICE") return "";
  const i = rtNextRow(c), t = LINEE.flatMap(l => l.tab).find(x => x.corse.includes(c));
  return ` · in viaggio${rtBadge(r)}${i != null && t ? ` · prossima: ${esc(STOPS[t.fermate[i]][1])}` : ""}`;
}

function renderLine() {
  const l = byId[state.line];
  pickDefaults(l);
  const svcs = [...new Set(l.tab.map(t => t.svc))];
  const tabs = l.tab.filter(t => t.svc === state.svc);
  const t = tabs.find(x => x.dir === state.dir) || tabs[0];
  const sv = SVC[state.svc];

}

const veh = { on: false, live: false, min: 480, timer: null, layer: L.layerGroup().addTo(map), markers: new Map() };
const geoCache = {};
// proietta le fermate servite sul percorso: distanza progressiva (km) di ciascuna fermata
function tripGeo(c, t) {
  const served = []; c.o.forEach((v, k) => { if (v != null) served.push(k); });
  const key = c.shape + "|" + t.fermate.length + "|" + served.map(k => t.fermate[k]).join(",");
  if (geoCache[key]) return geoCache[key];
  const pts = shapePts(c.shape);
  const lat0 = pts.length ? pts[0][0] : 42, kx = 111.32 * Math.cos(lat0 * Math.PI / 180), ky = 110.57;
  const xy = pts.map(p => [p[1] * kx, p[0] * ky]);
  const cum = [0];
  for (let j = 1; j < xy.length; j++) cum.push(cum[j - 1] + Math.hypot(xy[j][0] - xy[j - 1][0], xy[j][1] - xy[j - 1][1]));
  const proj = (j, x, y) => {
    const [ax, ay] = xy[j], [bx, by] = xy[j + 1], dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
    const u = L2 ? Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / L2)) : 0;
    return [Math.hypot(ax + u * dx - x, ay + u * dy - y), cum[j] + u * (cum[j + 1] - cum[j])];
  };
  let j0 = 0, s0 = 0;
  const pos = served.map(k => {
    const st = STOPS[t.fermate[k]], x = st[4] * kx, y = st[3] * ky;
    if (xy.length < 2) return { k, s: 0 };
    let best = null, firstNear = -1;
    for (let j = j0; j < xy.length - 1; j++) {
      const [d, s] = proj(j, x, y);
      if (s < s0 - 1e-6) continue;
      if (!best || d < best[0]) best = [d, s, j];
      if (firstNear < 0 && d < 0.08) firstNear = j;
      if (firstNear >= 0 && j > firstNear + 6) break; // prima occorrenza vicina: utile per le linee circolari
    }

function along(g, s) {

// corsa in viaggio secondo il tempo reale: il bus sta fra la fermata precedente e la prossima indicata dalle API,
// avanzando con l'orario corretto del ritardo; così resta visibile anche se il ritardo comunicato non è aggiornato
function busLive(c, t, m, nextRow) {
  if (nextRow == null) return null;

  veh.markers.forEach((mk, id) => { if (!seen.has(id)) { veh.layer.removeLayer(mk); veh.markers.delete(id); } });
  $("#vehCnt").textContent = live
    ? `${seen.size} bus in viaggio · ${nLive} in tempo reale (bordo verde), gli altri stimati dagli orari`
    : `${seen.size} bus in viaggio · posizioni stimate dagli orari, non in tempo reale`;
}
function vehStop() { clearInterval(veh.timer); veh.timer = null; $("#vehPlay").textContent = "▶"; $("#vehPlay").setAttribute("aria-pressed", "false"); }
function vehNow() {
  const now = new Date(), today = ymd(now);
  veh.live = true;  // segue l'ora attuale: si possono usare i dati in tempo reale
  if (today >= D.feed.dal && today <= D.feed.al && today !== state.day) setDay(today);
  veh.min = Math.max(tRange[0], Math.min(tRange[1], now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60));
  updateVehicles();
}
$("#vehOn").addEventListener("click", e => {
  if (e.isTrusted) veh.manuale = true;  // scelta di chi usa il sito: l'accensione automatica non la cambia più
  veh.on = !veh.on;
  $("#vehOn").setAttribute("aria-pressed", veh.on);
  ["#vehPlay", "#vehMin", "#vehNow"].forEach(s => $(s).disabled = !veh.on);
  if (veh.on) {
    const now = new Date();
    if (ymd(now) === state.day) vehNow(); else { veh.live = false; veh.min = Math.max(tRange[0], 7 * 60 + 30); updateVehicles(); }
  } else {
    vehStop(); veh.layer.clearLayers(); veh.markers.clear();
    $("#vehOut").value = "--:--"; $("#vehCnt").textContent = "";
  }
});
$("#vehMin").addEventListener("input", e => { veh.live = false; veh.min = +e.target.value; updateVehicles(); });
$("#vehNow").addEventListener("click", () => { vehStop(); vehNow(); });
$("#vehPlay").addEventListener("click", () => {
  if (veh.timer) return vehStop();
  veh.live = false;
  $("#vehPlay").textContent = "❚❚"; $("#vehPlay").setAttribute("aria-pressed", "true");
  veh.timer = setInterval(() => {
    veh.min += 0.25; // 2,5 minuti di orario al secondo
    if (veh.min > tRange[1]) { veh.min = tRange[1]; vehStop(); }
    updateVehicles();
  }, 100);
});

/* ---------- tempo reale: ritardi delle corse di oggi dal proxy delle API Astral ---------- */
// indirizzo del proxy (impostato in build_data.py); vuoto = sito con i soli orari programmati
const REALTIME = "https://udr-realtime.antonini1971.workers.dev";
const rt = { trips: new Map(), at: null, ok: false, firma: "" };
const rtLive = () => rt.ok && state.day === ymd(new Date());
const rtOf = id => rtLive() ? rt.trips.get(id) : null;
const rtKey = c => c.tid || c.id;  // i dati in tempo reale usano il trip_id del GTFS (c.tid se l'id mostrato è un altro)
const rtMin = r => Math.round((r.ritardo || 0) / 60);
// riga del quadro della prossima fermata della corsa: "prossima" conta da 0 le fermate servite dalla corsa
function rtNextRow(c) {
  const r = rtOf(rtKey(c));
  if (!r || r.stato !== "IN_SERVICE" || r.prossima == null) return null;
  let n = -1;
  for (let i = 0; i < c.o.length; i++) if (c.o[i] != null && ++n === r.prossima) return i;
  return null;
}
// firma dei dati in tempo reale del quadro mostrato: se non cambia, il quadro non si ridisegna
const rtFirma = t => t.corse.map(c => { const r = rtOf(rtKey(c)); return r ? `${r.stato}${r.ritardo}/${r.prossima}` : ""; }).join("|");
function quadroAttuale() {
  const l = state.line && byId[state.line];
  if (!l) return null;
  const tabs = l.tab.filter(t => t.svc === state.svc);
  return tabs.find(x => x.dir === state.dir) || tabs[0];
}
// cerchio verde sulla prossima fermata della corsa selezionata
const nextLayer = L.layerGroup().addTo(map);
function drawNext() {
  nextLayer.clearLayers();
  const t = quadroAttuale(), c = t && state.trip && t.corse.find(x => x.id === state.trip);
  const i = c && rtNextRow(c);
  if (i == null) return;
  const st = STOPS[t.fermate[i]], r = rtOf(rtKey(c));
  // etichetta solo al passaggio del mouse: un'etichetta fissa coprirebbe il bus (le etichette stanno sopra i marcatori)
  nextLayer.addLayer(L.circleMarker([st[3], st[4]], { renderer, radius: 13, color: "#1f7a3a", weight: 4, fillColor: "#1f7a3a", fillOpacity: .2 })
    .bindTooltip(`Prossima fermata: <b>${esc(st[1])}</b> · arrivo previsto ${hhmm(Math.round(c.o[i] + (r.ritardo || 0) / 60))} (tempo reale)`,
      { direction: "top", offset: [0, -12] }));
}
const oraDi = iso => new Date(iso).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
function rtTesto(r) {
  const d = rtMin(r);
  return (d >= 1 ? `in ritardo di ${d} min` : d <= -1 ? `in anticipo di ${-d} min` : "in orario") +
    (r.segnale ? ` (ultimo segnale ${oraDi(r.segnale)})` : "");
}
function rtBadge(r) {
  // solo le corse partite: per quelle in attesa il ritardo non è ancora noto
  if (!r || r.stato !== "IN_SERVICE") return "";
  const d = rtMin(r);
  return `<span class="rt ${d >= 1 ? "late" : d <= -1 ? "early" : ""}" title="Tempo reale: ${esc(rtTesto(r))}">${d >= 1 ? `+${d}′` : d <= -1 ? `−${-d}′` : "0′"}</span>`;
}
function rtNote() {
  if (!REALTIME || !rtLive()) return "";
  return ` Sotto il numero delle corse in viaggio: ritardo (+) o anticipo (−) in minuti, in tempo reale (aggiornato alle ${oraDi(rt.at)}).`;
}
function rtRefresh() {
  // quadro orario aperto: si ridisegna solo se i suoi dati sono cambiati, mantenendo lo scorrimento della tabella
  const t = quadroAttuale();
  if (t && rtFirma(t) !== rt.firma) {
    const w = document.querySelector(".tt-wrap"), sx = w ? w.scrollLeft : 0, sy = w ? w.scrollTop : 0;
    renderLine();
    const w2 = document.querySelector(".tt-wrap"); if (w2) { w2.scrollLeft = sx; w2.scrollTop = sy; }
  }
  drawNext();
  document.querySelectorAll("[data-rt]").forEach(el => { el.innerHTML = rtBadge(rtOf(el.dataset.rt)); });
  document.querySelectorAll("[data-favrt]").forEach(el => {
    const b = el.closest("button"), r = b && trovaPreferito({ line: b.dataset.favline, id: b.dataset.favtrip });
    el.innerHTML = r ? favRT(r.c) : "";
  });
  document.querySelectorAll("[data-rtnote]").forEach(el => { el.textContent = rtNote(); });
  if (veh.on && veh.live) vehNow();
}
async function rtLoad() {
  if (document.hidden) return;  // pagina in secondo piano: nessuna richiesta
  try {
    const r = await fetch(REALTIME.replace(/\/+$/, "") + "/corse", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    rt.trips = new Map((j.corse || []).map(c => [c.trip, c]));
    rt.at = j.aggiornato || new Date().toISOString();
    rt.ok = true;
    // con i dati in tempo reale di oggi i bus si mostrano da soli, se chi usa il sito non ha già scelto
    if (!veh.on && !veh.manuale && rtLive()) $("#vehOn").click();
  } catch (e) {
    rt.ok = false;  // proxy non raggiungibile: restano gli orari programmati
  }
  rtRefresh();
}
if (REALTIME && /^https?:$/.test(location.protocol)) {
  $("#vehOn").title = "Posizione dei bus: in tempo reale dove ci sono i dati (bordo verde), altrimenti stimata dagli orari";
  rtLoad();
  setInterval(rtLoad, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) rtLoad(); });
}

/* ---------- percorsi della linea scelta sulla mappa ---------- */
const routeLayer = L.layerGroup().addTo(map);
const arrowLayer = L.layerGroup().addTo(map);
let routeHover = null;
function arrowsAlong(pts, col, step) {
  const lp = pts.map(p => map.latLngToLayerPoint(p));
  let next = step / 2, run = 0;
  for (let j = 1; j < lp.length; j++) {
    const dx = lp[j].x - lp[j - 1].x, dy = lp[j].y - lp[j - 1].y, d = Math.hypot(dx, dy);
    while (d > 0 && next <= run + d) {
      const u = (next - run) / d;
      const ll = map.layerPointToLatLng(L.point(lp[j - 1].x + u * dx, lp[j - 1].y + u * dy));
      const deg = Math.atan2(dy, dx) * 180 / Math.PI;
      arrowLayer.addLayer(L.marker(ll, { interactive: false, keyboard: false, icon: L.divIcon({ className: "arr-ico", iconSize: [14, 14], iconAnchor: [7, 7],
        html: `<svg width="14" height="14" viewBox="0 0 14 14" style="transform:rotate(${deg.toFixed(1)}deg)"><path d="M3 2 L12 7 L3 12 L5.5 7 Z" fill="#fff" stroke="${col}" stroke-width="1.8" stroke-linejoin="round"/></svg>` }) }));
      next += step;
    }
    run += d;
  }
}
function drawRoute(hover) {
  if (hover !== undefined) routeHover = hover;
  routeLayer.clearLayers(); arrowLayer.clearLayers();
  if (!state.line) return;
  const l = byId[state.line], PV = percorsiOf(l);
  const focus = routeHover || state.variant;
  const fv = PV.find(v => v.id === focus);
  const curDir = fv ? fv.dir : state.dir;
  const order = [...PV].sort((a, b) => (a.dir === curDir) - (b.dir === curDir) || (a.id === focus) - (b.id === focus));
  order.forEach(v => {
    const pts = shapePts(v.id); if (!pts.length) return;
    const same = v.dir === curDir, isF = v.id === focus;
    const opacity = focus ? (isF ? 1 : same ? .35 : .25) : same ? 1 : .55;
    routeLayer.addLayer(L.polyline(pts, { renderer, color: "#000", weight: isF ? 11 : same ? 8 : 5, opacity: opacity * .22, interactive: false }));
    const pl = L.polyline(pts, { renderer, color: l.col, weight: isF ? 7 : same ? 5 : 3, opacity, dashArray: same ? null : "7 7" });
    pl.bindTooltip(`Linea ${esc(l.n)} · percorso ${v.lett}: da ${esc(STOPS[v.da][1])} a ${esc(STOPS[v.a][1])}`, { sticky: true });
    pl.on("click", () => { const b = document.querySelector(`#perc [data-var="${CSS.escape(v.id)}"]`); if (b) b.click(); });
    routeLayer.addLayer(pl);
  });
  // frecce del senso di marcia e capolinea: il percorso evidenziato, altrimenti tutti quelli della direzione scelta
  const shown = PV.filter(v => focus ? v.id === focus : v.dir === curDir);
  shown.forEach(v => {
    const pts = shapePts(v.id); if (!pts.length) return;
    arrowsAlong(pts, l.col, shown.length > 1 ? 150 : 110);
    [[v.da, "P", "Partenza"], [v.a, "A", "Arrivo"]].forEach(([s, ch, lab]) => {
      const st = STOPS[s];
      routeLayer.addLayer(L.marker([st[3], st[4]], { keyboard: false, zIndexOffset: 300, icon: L.divIcon({ className: "cap-ico", iconSize: [20, 20], iconAnchor: [10, 10],
        html: `<span style="background:${l.col};color:${textOn(l.col)};border-radius:${ch === "P" ? "50%" : "3px"}">${ch}</span>` }) })
        .bindTooltip(`${lab} percorso ${v.lett}: ${esc(st[1])}`, { direction: "top", offset: [0, -10] })
        .on("click", () => openStop(s)));
    });
  });
  tripLayer.eachLayer(x => x.bringToFront());
  stopLayer.eachLayer(x => x.bringToFront());
}
map.on("zoomend", () => { if (state.line) drawRoute(); });

/* ---------- navigazione ---------- */
function lineVisible(l) {
  if (state.line === l.id) return true;
  if (areeDi(l).every(a => filt.areas.has(a))) return false;  // nascosta solo se tutti i suoi comuni sono esclusi
  if (filt.onlyActive && !tripsOn(l, state.day)) return false;
  return true;
}
function styleLines() {
  LINEE.forEach(l => {
    const vis = lineVisible(l) && state.line !== l.id; // la linea scelta è disegnata da drawRoute
    if (vis && !map.hasLayer(lineLayers[l.id])) map.addLayer(lineLayers[l.id]);
    if (!vis && map.hasLayer(lineLayers[l.id])) map.removeLayer(lineLayers[l.id]);
    const sel = !state.line || state.line === l.id;
    lineLayers[l.id].eachLayer(pl => {
      if (pl.options.opacity === 0) return;
      pl.setStyle({ opacity: state.line ? (sel ? 1 : .12) : .85, weight: state.line && sel ? 5 : 3.5 });
    });
    if (state.line === l.id) lineLayers[l.id].bringToFront();
  });
  updateVehicles();
}
function go(id) {
  const target = id ? "#linea-" + id : "#";
  if (location.hash !== target && !(target === "#" && !location.hash)) { history.pushState(null, "", id ? target : location.pathname + location.search); }
  apply(id);
}
function apply(id) {
  const nuova = id && byId[id] ? id : null;
  if (state.line !== nuova) state.variant = null;
  state.line = nuova;
  state.trip = null;
  tripLayer.clearLayers();
  map.closePopup();
  styleLines();
  if (state.line) {
    const l = byId[state.line];
    stopsForLine(l);
    if (!map.hasLayer(stopLayer)) map.addLayer(stopLayer);
    const b = lineLayers[l.id].getBounds();
    if (b.isValid()) map.fitBounds(b, { padding: [24, 24] });
    renderLine();
  } else {
    stopsOverview();
    updateZoomStops();
    if (allBounds.isValid()) map.fitBounds(allBounds, { padding: [20, 20] });
    renderOverview();
    drawRoute();
  }
  renderList();
}
window.addEventListener("popstate", () => apply(location.hash.replace(/^#linea-/, "")));
// titolo: torna alla mappa iniziale con tutte le linee, senza ricaricare la pagina (resta il giorno scelto)
$("#home").addEventListener("click", e => {
  if (e.ctrlKey || e.metaKey || e.shiftKey || e.button) return;  // apertura in un'altra scheda: come un link normale
  e.preventDefault();
  $("#cerca").value = "";
  go(null);
  window.scrollTo({ top: 0, behavior: "smooth" });
});
window.addEventListener("hashchange", () => apply(location.hash.replace(/^#linea-/, "")));

/* ---------- giorno ---------- */
function setDay(d) {
  if (d < D.periodo.dal || d > D.periodo.al) {  // giorno di un altro orario: si ricarica la pagina con quello
    location.href = location.pathname + "?giorno=" + d + location.hash;
    return;
  }
  state.day = d;
  $("#giorno").value = isoOf(d);
  const active = Object.keys(SVC).filter(s => activeOn(s, d)).map(s => SVC[s].label);
  $("#daytag").textContent = active.length ? itLong(d) : itLong(d) + " · nessun servizio";
  if (state.line) renderLine(); else renderOverview();
  renderList();
  if (map) { styleLines(); if (!state.line && filt.onlyActive) stopsOverview(); updateZoomStops(); }
}
$("#giorno").min = isoOf(D.feed.dal);
$("#giorno").max = isoOf(D.feed.al);
$("#giorno").addEventListener("change", e => {
  const v = e.target.value.replace(/-/g, "");
  if (v.length === 8) setDay(v < D.feed.dal ? D.feed.dal : v > D.feed.al ? D.feed.al : v);
});

/* ---------- avvio ---------- */
(function init() {
  $("#sottotitolo").textContent = `${D.agenzia.nome} · orario dal ${itDate(D.feed.dal)} al ${itDate(D.feed.al)}`;
  const periodo = ORARI.length > 1 ? ` Per il giorno scelto vale l'orario in vigore dal ${itDate(D.periodo.dal)} al ${itDate(D.periodo.al)}:` : "";
  $("#piede").innerHTML = `Orario valido dal ${itDate(D.feed.dal)} al ${itDate(D.feed.al)}.${periodo} ${LINEE.length} linee, ` +
    `${LINEE.reduce((n, l) => n + l.tab.reduce((m, t) => m + t.corse.length, 0), 0)} corse, ${stopUse.filter(u => u.length).length} fermate servite. ` +
    `Informazioni: ${esc(D.agenzia.nome)}${D.agenzia.tel ? `, telefono <span style="user-select:all">${esc(D.agenzia.tel)}</span>` : ""}` +
    (D.agenzia.url ? `, <a href="${esc(D.agenzia.url)}" target="_blank" rel="noopener">${esc(D.agenzia.url.replace(/^https?:\/\//, "").replace(/\/$/, ""))}</a>` : "") +
    `. Mappe © Esri e fornitori.`;
  state.onlyMain = store.get("udr4-soloPrinc") !== "0";
  const today = ymd(new Date());
  const g = GIORNO_URL && GIORNO_URL >= D.feed.dal && GIORNO_URL <= D.feed.al ? GIORNO_URL : today;
  state.day = g >= D.periodo.dal && g <= D.periodo.al ? g : D.periodo.dal;
  // se il giorno scelto non ha servizio (es. domenica prima dell'avvio), resta comunque selezionabile
  setDay(state.day);
  apply(location.hash.replace(/^#linea-/, ""));
})();
</script>
